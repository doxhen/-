<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>intro-quiz 임베드 점검</title>
<style>body{background:#0b0d12;color:#e8edfa;font:14px/1.5 system-ui,sans-serif;padding:20px}
table{border-collapse:collapse;width:100%;max-width:900px}td,th{border-bottom:1px solid #262f42;padding:6px 8px;text-align:left;font-size:13px}
.ok{color:#34d399}.bad{color:#ff4d8d}.wait{color:#fbbf24}</style></head>
<body>
<h1 style="font-size:16px">임베드 재생 점검</h1>
<div id="player"></div>
<table><thead><tr><th>#</th><th>영상 ID</th><th>결과</th><th>제목</th><th>길이</th></tr></thead><tbody id="rows"></tbody></table>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const IDS=["phuiiNCxRMg","pSUydWEqKwE","vnS_jn2uibs","AlirzLFEHUI","ekr2nIex040","NMjhjrBIrG8","07EzMbVH3QE","-GQg25oP0S4","BBdC1rl5sKY","GpQ222I1ULc","EIz09kLzN9k","bNKXxwOQYB8","eN5mG_yMDiM","jeqdYqsrsA0","6f3RzjXPQwA","hVAc1Vf2ITU","Vk5-c_v4gMU","0TAAUWHo4Ec","9bZkp7q19f0","U7mPqycQ0tQ"];
let idx=0, player=null, done=false;
const tbody=document.getElementById("rows");
IDS.forEach((id,i)=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${i+1}</td><td>${id}</td><td class="r wait">대기</td><td class="t"></td><td class="d"></td>`;tbody.appendChild(tr);});
function set(i,cls,txt,title,len){const tr=tbody.children[i];const c=tr.querySelector(".r");c.className="r "+cls;c.textContent=txt;if(title)tr.querySelector(".t").textContent=title;if(len)tr.querySelector(".d").textContent=len;}
function onReady(){ player.mute(); step(); }
function step(){
  if(idx>=IDS.length){done=true;window.__done=true;document.title="DONE";return;}
  const i=idx, id=IDS[i];
  set(i,"wait","확인 중");
  try{ player.loadVideoById({videoId:id,startSeconds:0}); }catch(e){ fail(i,"exception"); return; }
  let n=0;
  (function poll(){
    if(done) return;
    if(n++>22) return fail(i,"timeout");
    let vd={}, dur=0, st=-1;
    try{ vd=player.getVideoData()||{}; dur=player.getDuration()||0; st=player.getPlayerState(); }catch(e){}
    if(vd.video_id===id && (dur>20 || st===1)){
      set(i,"ok","재생 OK",vd.title||"",Math.round(dur)+"초");
      idx++; done=false; setTimeout(step,400); return;
    }
    setTimeout(poll,500);
  })();
}
function fail(i,why){
  let last=false;
  if(idx===IDS.length-1) last=true;
  set(i,"bad",why);
  idx++;
  setTimeout(step,400);
}
function onError(e){
  const map={2:"잘못된 ID",5:"HTML5 오류",100:"영상 없음/비공개",101:"임베드 차단",150:"임베드 차단"};
  fail(idx, (map[e.data]||"오류")+" ("+e.data+")");
}
window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player("player",{height:"180",width:"320",playerVars:{autoplay:0,controls:0,playsinline:1},events:{onReady:onReady,onError:onError}});
};
</script>
</body></html>
