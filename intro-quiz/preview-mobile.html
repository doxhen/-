<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>mobile preview</title>
<style>
  html,body{margin:0;background:#0d1017;height:100%}
  .stage{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;padding:0}
  .phone{width:390px;height:844px;transform:scale(.82);transform-origin:top center;border-radius:28px;overflow:hidden;box-shadow:0 0 0 10px #1b2130,0 30px 60px rgba(0,0,0,.6);background:#000}
  .phone iframe{width:390px;height:844px;border:0;display:block}
</style></head>
<body>
  <div class="stage">
    <div class="phone"><iframe src="./index.html" title="mobile"></iframe></div>
  </div>
</body></html>
